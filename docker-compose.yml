name: rag-project

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build: ./ai-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence-transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      MIN_SCORE: ${MIN_SCORE:-0.82}
      RESET_VECTORS_ON_DIM_CHANGE: ${RESET_VECTORS_ON_DIM_CHANGE:-false}
      RERANK_MODEL: ${RERANK_MODEL:-}
      LLM_BACKEND: ${LLM_BACKEND:-fake}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hfcache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      AiService__BaseUrl: ${AI_SERVICE_URL:-http://ai-service:8000/}
      AiService__InternalKey: ${INTERNAL_API_KEY:-}
      Database__MigrateOnStartup: "true"
      Storage__Path: /data/uploads
      Cors__Origins__0: http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  hfcache:
  uploads:
