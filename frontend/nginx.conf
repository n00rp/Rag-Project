server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads go through here, so allow slightly more than the API's 25 MB limit.
  client_max_body_size 30m;

  # Same-origin proxy to the .NET API. This is what lets the PDF viewer iframe load documents
  # without CORS or cookies getting in the way.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A local LLM can take a while to answer.
    proxy_read_timeout 180s;
    proxy_buffering off;
  }

  location = /health {
    proxy_pass http://api:8080;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The pdf.js worker is an ES module (.mjs); nginx's default mime.types serves it as
  # application/octet-stream, which browsers refuse to run as a module worker.
  location ~ ^/assets/.+\.mjs$ {
    default_type text/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
