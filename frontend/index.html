<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ställ frågor till svenska kommunala dokument och få svar med exakta källhänvisningar." />
    <meta name="theme-color" content="#f6f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0c11" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kommunkoll – fråga dina kommundokument" />
    <meta property="og:description" content="Ställ frågor på svenska till kommunala protokoll och få svar med exakt källa och sida." />
    <title>Kommunkoll – fråga dina kommundokument</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a light flash in dark mode.
      try {
        var saved = localStorage.getItem('theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
