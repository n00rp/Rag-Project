name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ai-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: change-me-locally
          POSTGRES_DB: docassistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d docassistant"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../eval
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: change-me-locally
          POSTGRES_DB: docassistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d docassistant"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      # Generated migrations are not formatted by hand.
      - run: dotnet format --no-restore --verify-no-changes --exclude "**/Migrations/**"
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release
